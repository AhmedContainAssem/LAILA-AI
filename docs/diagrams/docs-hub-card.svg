<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="hubBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="100%" stop-color="#0A1322"/>
    </linearGradient>
  </defs>

  <style>
    .cat-h { font-family: 'Segoe UI', Inter, sans-serif; font-weight: 800; font-size: 11px; fill: #00B4FF; letter-spacing: 2px; text-anchor: middle; }
    .sec-h { font-family: 'Segoe UI', Inter, sans-serif; font-weight: 800; font-size: 20px; fill: #FFFFFF; letter-spacing: 1px; text-anchor: middle; }
    .doc-t { font-family: 'Segoe UI', Inter, sans-serif; font-weight: 700; font-size: 13px; fill: #FFFFFF; }
    .doc-p { font-family: 'Segoe UI', Inter, sans-serif; font-weight: 400; font-size: 10px; fill: #64748B; }
  </style>

  <rect width="1200" height="240" rx="16" fill="url(#hubBg)" stroke="#1E293B" stroke-width="1.5"/>

  <text x="600" y="32" class="cat-h">ARCHITECTURAL KNOWLEDGE BASE</text>
  <text x="600" y="58" class="sec-h">📖 MASTER DOCUMENTATION SUITE</text>

  <!-- Card 1 -->
  <g transform="translate(45, 80)">
    <rect width="260" height="125" rx="10" fill="#0A1526" stroke="#00B4FF" stroke-width="1"/>
    <text x="20" y="32" class="doc-t">📘 Engineering Handbook</text>
    <text x="20" y="50" font-size="10" fill="#00B4FF">Official Technical Gospel</text>
    <text x="20" y="78" class="doc-p">Deep architectural decisions, schemas, and lessons 1-13.</text>
    <rect x="20" y="102" width="40" height="3" rx="1.5" fill="#00B4FF"/>
  </g>

  <!-- Card 2 -->
  <g transform="translate(325, 80)">
    <rect width="260" height="125" rx="10" fill="#0A1526" stroke="#FF007A" stroke-width="1"/>
    <text x="20" y="32" class="doc-t">🔬 Latest Discoveries</text>
    <text x="20" y="50" font-size="10" fill="#FF007A">Root-Cause Post-Mortems</text>
    <text x="20" y="78" class="doc-p">Detailed investigation logs on runtime FSM, sockets &amp; locks.</text>
    <rect x="20" y="102" width="40" height="3" rx="1.5" fill="#FF007A"/>
  </g>

  <!-- Card 3 -->
  <g transform="translate(605, 80)">
    <rect width="260" height="125" rx="10" fill="#0A1526" stroke="#00F5A0" stroke-width="1"/>
    <text x="20" y="32" class="doc-t">🧠 LAILA Philosophy</text>
    <text x="20" y="50" font-size="10" fill="#00F5A0">Cognitive Principles</text>
    <text x="20" y="78" class="doc-p">"System Over Model" and reasoning-action decoupling ethos.</text>
    <rect x="20" y="102" width="40" height="3" rx="1.5" fill="#00F5A0"/>
  </g>

  <!-- Card 4 -->
  <g transform="translate(885, 80)">
    <rect width="270" height="125" rx="10" fill="#0A1526" stroke="#9D4EDD" stroke-width="1"/>
    <text x="20" y="32" class="doc-t">📐 System Architecture</text>
    <text x="20" y="50" font-size="10" fill="#9D4EDD">Subsystems Blueprint</text>
    <text x="20" y="78" class="doc-p">5-layer breakdown and state machine operational models.</text>
    <rect x="20" y="102" width="40" height="3" rx="1.5" fill="#9D4EDD"/>
  </g>
</svg>
